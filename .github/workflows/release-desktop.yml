# Publishes the desktop guard on a version tag (v0.1.0): the core tests, then
# the linuxX64 build packed by desktop/package.sh, as a GitHub release that
# machines install without a checkout, a JDK or Kotlin/Native (loadout's
# intentional program downloads it). The tag must match `intentional --version`.
name: release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Ktor's curl engine (sync) links libcurl.
      - name: libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      # Kotlin/Native's toolchain (LLVM, sysroot), a few hundred MB per fresh download.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Tests (core on JVM and linuxX64, desktop)
        run: ./gradlew :core:allTests :desktop:linuxX64Test

      - name: Build and pack
        run: |
          staged=$(sh desktop/package.sh --archive | tail -n 1)
          version=$("$staged/bin/intentional" --version | cut -d' ' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match intentional $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "desktop/build/dist/intentional-$VERSION-linux-x64.tar.gz" \
            "desktop/build/dist/intentional-$VERSION-linux-x64.tar.gz.sha256" \
            --title "intentional $VERSION" \
            --notes "Desktop guard for Omarchy / Hyprland: the daemon (linuxX64) and its Brave extension. Install: unpack and run install.sh, or loadout's intentional program."
