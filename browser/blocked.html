<!doctype html>
<meta charset="utf-8">
<title>budget used</title>

  :root { --bg: #1a1b26; --ink: #c0caf5; --muted: #737aa2; --accent: #7aa2f7; }

    :root { --bg: #e1e2e7; --ink: #3760bf; --muted: #68709a; --accent: #2e7de9; }

  body {
    margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center;
    background: var(--bg); color: var(--ink); font: 18px/1.6 ui-monospace, monospace;
